# CI: يشغّل الاختبارات ويبني الواجهة على خوادم GitHub (حيث Packagist متاح).
# ملاحظة: لم يُشغَّل هذا الـ workflow بعد؛ راجع أول تشغيل بعناية.
name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, zip, gd, xml, curl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build assets
        run: |
          npm install
          npm run build

      - name: Run tests
        run: php artisan test
